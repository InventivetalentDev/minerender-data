name: Publish version data
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Exact Minecraft version to extract and publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - id: versions
        env:
          MC_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$MC_VERSION" ]; then
            matrix=$(node tools/versions.js --version "$MC_VERSION")
          else
            matrix=$(node tools/versions.js)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  publish:
    needs: discover
    if: ${{ toJSON(fromJSON(needs.discover.outputs.matrix).include) != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: data-${{ matrix.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/minerender-data
          key: minecraft-${{ runner.os }}-${{ matrix.version }}-${{ hashFiles('tools/runtime.js', 'tools/download.js') }}
      - run: node --test
      - name: Extract and check reproducibility
        env:
          MC_VERSION: ${{ matrix.version }}
        run: |
          node tools/extract.js --version "$MC_VERSION" --output out/first
          node tools/extract.js --version "$MC_VERSION" --output out/second --offline
          diff -r out/first out/second
      - name: Publish the validated version branch
        env:
          MC_VERSION: ${{ matrix.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node tools/publish.js --version "$MC_VERSION" --input out/first --push
