name: Verify extraction
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ['1.21.5', '1.21.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/minerender-data
          key: minecraft-${{ runner.os }}-${{ matrix.version }}-${{ hashFiles('tools/runtime.js', 'tools/download.js') }}
      - run: node --test
      - name: Extract twice and compare every output byte
        env:
          MC_VERSION: ${{ matrix.version }}
        run: |
          node tools/extract.js --version "$MC_VERSION" --output out/first
          node tools/extract.js --version "$MC_VERSION" --output out/second --offline
          diff -r out/first out/second
          node tools/validate.js --input out/first --version "$MC_VERSION"
